name: Build Suying APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'
      - name: Build APK (github flavor, release)
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew assembleGithubRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Suying-APK
          path: app/build/outputs/apk/github/release/*.apk
